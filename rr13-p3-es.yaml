apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-late
  namespace: rr13-p3
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: rr13-k8s
    kind: SecretStore
  target:
    name: app-credentials-copy
  data:
    - secretKey: token
      remoteRef:
        key: app-credentials
        property: token
